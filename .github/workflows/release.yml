name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  FFMPEG_VERSION: "8.1.1"

jobs:
  windows:
    name: Build & publish Windows installers
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache FFmpeg download
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-${{ env.FFMPEG_VERSION }}.zip
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-full

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = $env:TAG.TrimStart('v')
          if ($pkg -ne $tag -or $conf -ne $tag -or $cargo -ne $tag) {
            throw "Tag $env:TAG does not match versions (package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo). Run 'pnpm bump $tag'."
          }

      - name: Bundle FFmpeg sidecars
        shell: pwsh
        run: |
          $env:TEMP = "${{ runner.temp }}"
          ./scripts/bundle-ffmpeg.ps1 -Download -Version $env:FFMPEG_VERSION

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          $out = New-Item -ItemType Directory -Force dist-release
          $bundle = "src-tauri/target/release/bundle"
          Copy-Item "$bundle/nsis/*_x64-setup.exe" "$out/Beaver-Video-Editor_${v}_x64-setup.exe"
          Copy-Item "$bundle/msi/*_x64_en-US.msi" "$out/Beaver-Video-Editor_${v}_x64_en-US.msi"
          Get-ChildItem $out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$out/SHA256SUMS.txt"

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          node scripts/release-notes.mjs $env:TAG | Set-Content release-notes.md -Encoding utf8
          @"

          ---
          **Downloads:** ``Beaver-Video-Editor_*_x64-setup.exe`` (recommended, per-user install) or the ``.msi``. Windows 10/11 x64.
          Installers bundle FFmpeg $env:FFMPEG_VERSION (GPL-3.0); see [THIRD_PARTY_NOTICES.md](https://github.com/${{ github.repository }}/blob/$env:TAG/THIRD_PARTY_NOTICES.md).
          Installers are not code-signed yet, so Windows SmartScreen may warn — choose **More info → Run anyway**.
          "@ | Add-Content release-notes.md -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ env.TAG }}
          path: dist-release/*

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ($env:TAG -match '-') { '--prerelease' } else { '--latest' }
          # PowerShell doesn't expand globs for native commands, so pass real paths.
          $files = (Get-ChildItem dist-release -File).FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
            gh release edit $env:TAG --notes-file release-notes.md
          } else {
            gh release create $env:TAG @files --title "Beaver Video Editor $env:TAG" --notes-file release-notes.md --verify-tag $pre
          }
