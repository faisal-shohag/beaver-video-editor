[package]
name = "beaver-video-editor"
version = "0.1.0"
description = "Fast, simple multi-track video editor"
authors = ["faisal-shohag"]
license = "MIT"
repository = "https://github.com/faisal-shohag/beaver-video-editor"
edition = "2021"

[lib]
name = "beaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Voice enhancement: ONNX Runtime (CPU), FFT, WAV output, model downloads.
# load-dynamic: onnxruntime.dll ships as a resource (the prebuilt static libs need a newer MSVC STL).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"] }
realfft = "3"
hound = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
sha2 = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
