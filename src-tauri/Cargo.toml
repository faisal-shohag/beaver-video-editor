[package]
name = "beaver-video-editor"
version = "0.1.0"
description = "Fast, simple multi-track video editor"
authors = ["faisal-shohag"]
license = "MIT"
repository = "https://github.com/faisal-shohag/beaver-video-editor"
edition = "2021"

[lib]
name = "beaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
